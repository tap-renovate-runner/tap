{% if cell.kind == "time" %}<time data-tap-localtime datetime="{{ cell.iso }}">{{ cell.text }}</time>{% elif cell.kind == "age" %}<time data-tap-age datetime="{{ cell.iso }}" title="{{ cell.iso }}">{{ cell.text }}</time>{% elif cell.kind == "state" %}<span class="tap-statcard__state" data-tap-state="{{ cell.state }}">{{ cell.text }}</span>{% elif cell.title %}<span title="{{ cell.title }}">{{ cell.text }}</span>{% else %}{{ cell.text }}{% endif %}
